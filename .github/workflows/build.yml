name: Build PhonePadNX
on:
  workflow_dispatch:
  push:
    paths: ['common/**', 'sysmodule/**', 'launcher/**', 'vendor/**', 'web/**', 'tools/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      - name: Test input protocol
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icommon common/pad.c tests/test_core.c -o /tmp/test-core
          /tmp/test-core
      - name: Embed phone interface
        run: python3 tools/embed.py
      - name: Test HTTP server
        run: |
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Icommon common/pad.c common/server.c tests/simulator.c -o tests/simulator
          python3 tests/integration.py
      - name: Build background module
        run: make -C sysmodule -j2
      - name: Build launcher
        run: make -C launcher -j2
      - name: Package SD card files
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePadNX-experimental
          path: dist/PhonePadNX-0.1.1-test.zip
      - name: Publish test release
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish.py
