name: Build PhonePadNX
on:
  workflow_dispatch:
  push:
    paths: ['common/**', 'sysmodule/**', 'launcher/**', 'vendor/**', 'web/**', 'tools/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed phone interface
        run: python3 tools/embed.py
      - name: Build background module
        run: make -C sysmodule -j2
      - name: Build launcher
        run: make -C launcher -j2
      - name: Package SD card files
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePadNX-experimental
          path: dist/PhonePadNX-0.1-experimental.zip
